enum Role { CLIENT EMPLOYEE ADMIN }
enum Priority { LOW NORMAL HIGH }
enum RequestStatus { CREATED ACCEPTED IN_REPAIR READY CLOSED CANCELLED }
enum RequestSort { CREATED_AT PRIORITY TOTAL_AMOUNT }
enum CatalogSort { NAME_ASC PRICE_ASC PRICE_DESC STOCK_ASC }
enum PaymentMethod { CASH CARD TRANSFER }

input RequestFilter { status: RequestStatus, categoryId: ID, from: String, to: String, priority: Priority }
input CatalogFilter { search: String, active: Boolean }
input DeviceInput { categoryId: ID!, model: String!, serialNumber: String, note: String }
input UpdateDeviceInput { id: ID!, model: String, serialNumber: String, note: String }
input RepairRequestInput { deviceId: ID!, description: String!, priority: Priority = NORMAL }
input CatalogServiceInput { id: ID, name: String!, price: Float!, isActive: Boolean = true }
input CatalogPartInput { id: ID, sku: String!, name: String!, price: Float!, stockQty: Int = 0, isActive: Boolean = true }

 type User { id: ID!, login: String!, status: String!, role: Role!, createdAt: String }
type AuthPayload { token: String!, user: User! }
type Client { id: ID!, userId: ID!, fullName: String!, phone: String!, email: String!, createdAt: String }
type DeviceCategory { id: ID!, name: String!, isActive: Boolean! }
type Device { id: ID!, clientId: ID!, categoryId: ID!, model: String!, serialNumber: String, note: String, createdAt: String, updatedAt: String, category: DeviceCategory, client: Client }
type RepairRequest { id: ID!, clientId: ID!, deviceId: ID!, categoryId: ID!, categoryName: String!, deviceModel: String!, description: String!, priority: Priority!, status: RequestStatus!, createdAt: String!, updatedAt: String!, workOrder: WorkOrder, notifications: [Notification!]! }
type WorkOrder { id: ID!, requestId: ID!, employeeId: ID, status: String!, totalAmount: Float!, paymentReceived: Boolean!, createdAt: String!, updatedAt: String!, serviceItems: [WorkOrderServiceItem!]!, partItems: [WorkOrderPartItem!]!, payments: [Payment!]! }
type WorkOrderServiceItem { id: ID!, workOrderId: ID!, serviceId: ID!, serviceName: String!, quantity: Int!, unitPrice: Float!, lineTotal: Float! }
type WorkOrderPartItem { id: ID!, workOrderId: ID!, partId: ID!, partSku: String!, partName: String!, quantity: Int!, unitPrice: Float!, lineTotal: Float! }
type CatalogService { id: ID!, name: String!, price: Float!, isActive: Boolean!, updatedAt: String }
type Part { id: ID!, sku: String!, name: String!, price: Float!, stockQty: Int!, isActive: Boolean!, updatedAt: String }
type Payment { id: ID!, workOrderId: ID!, clientId: ID!, amount: Float!, method: String!, status: String!, createdAt: String! }
type Notification { id: ID!, clientId: ID!, requestId: ID, eventType: String!, title: String!, body: String!, deliveryStatus: String!, createdAt: String!, sentAt: String }
type TopService { serviceId: ID!, serviceName: String!, itemsCount: Int!, amountSum: Float! }
type TopCategory { categoryId: ID!, categoryName: String!, requestsCount: Int! }
type AnalyticsSummary { periodFrom: String!, periodTo: String!, requestsCreated: Int!, requestsReady: Int!, requestsClosed: Int!, requestsCancelled: Int!, openRepairs: Int!, revenue: Float!, paymentsCount: Int!, topServices: [TopService!]!, topCategories: [TopCategory!]! }
type OperationResult { success: Boolean!, message: String! }

type Query {
  me: User
  myDevices: [Device!]!
  device(id: ID!): Device
  myRepairRequests: [RepairRequest!]!
  repairRequest(id: ID!): RepairRequest
  repairQueue(filter: RequestFilter, sort: RequestSort = CREATED_AT): [RepairRequest!]!
  workOrder(id: ID!): WorkOrder
  catalogServices(filter: CatalogFilter, sort: CatalogSort = NAME_ASC): [CatalogService!]!
  catalogParts(filter: CatalogFilter, sort: CatalogSort = NAME_ASC): [Part!]!
  myNotifications: [Notification!]!
  analyticsSummary(from: String!, to: String!): AnalyticsSummary!
}

type Mutation {
  registerUser(login: String!, password: String!, fullName: String!, phone: String!, email: String!): AuthPayload!
  login(login: String!, password: String!): AuthPayload!
  assignRole(userId: ID!, role: Role!): User!
  registerDevice(input: DeviceInput!): Device!
  updateDevice(input: UpdateDeviceInput!): Device!
  createRepairRequest(input: RepairRequestInput!): RepairRequest!
  acceptRepairRequest(id: ID!): RepairRequest!
  markDeviceReceived(id: ID!): RepairRequest!
  startDiagnosis(id: ID!): RepairRequest!
  addWorkOrderService(workOrderId: ID!, serviceId: ID!, quantity: Int = 1): WorkOrderServiceItem!
  addWorkOrderPart(workOrderId: ID!, partId: ID!, quantity: Int = 1): WorkOrderPartItem!
  calculateWorkOrderTotal(workOrderId: ID!): WorkOrder!
  approveRepairEstimate(id: ID!): RepairRequest!
  rejectRepairEstimate(id: ID!): RepairRequest!
  completeWorkOrder(workOrderId: ID!): WorkOrder!
  markDeviceReady(id: ID!): RepairRequest!
  closeRepairRequest(id: ID!): RepairRequest!
  cancelRepairRequest(id: ID!): RepairRequest!
  registerPayment(workOrderId: ID!, amount: Float!, method: PaymentMethod!): Payment!
  upsertService(input: CatalogServiceInput!): CatalogService!
  upsertPart(input: CatalogPartInput!): Part!
}
